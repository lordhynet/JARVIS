services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${JARVIS_VERIFY_DB_PASSWORD:?Verification password is required}
    volumes:
      - verification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JARVIS_VERIFY_PORT:-5198}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jarvis__StorageProvider: Postgres
      Jarvis__ApiKey: ${JARVIS_VERIFY_API_KEY:?Verification key is required}
      ConnectionStrings__Jarvis: Host=postgres;Database=jarvis;Username=jarvis;Password=${JARVIS_VERIFY_DB_PASSWORD}
volumes:
  verification-data:
