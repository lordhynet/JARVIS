name: Verify Core and companion workspace
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        env:
          POSTGRES_USER: jarvis_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jarvis_ci" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '11.0.x'
      - name: Backend including isolated PostgreSQL tests
        run: dotnet test Jarvis.sln --logger 'trx;LogFileName=ci.trx' -- xUnit.MaxParallelThreads=2
        env:
          JARVIS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=jarvis_ci;Password=ephemeral-ci-only;GSS Encryption Mode=Disable
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-results
          path: tests/Jarvis.Tests/TestResults/*.trx
  workspace:
    runs-on: ubuntu-latest
    env:
      FRONTEND_REPOSITORY: ${{ vars.JARVIS_FRONTEND_REPOSITORY }}
      MOBILE_REPOSITORY: ${{ vars.JARVIS_MOBILE_REPOSITORY }}
    steps:
      - name: Require explicit sibling repository configuration
        run: |
          test -n "$FRONTEND_REPOSITORY" || { echo 'Set JARVIS_FRONTEND_REPOSITORY (owner/repository).'; exit 1; }
          test -n "$MOBILE_REPOSITORY" || { echo 'Set JARVIS_MOBILE_REPOSITORY (owner/repository).'; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: JARVIS.CORE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ vars.JARVIS_FRONTEND_REPOSITORY }}
          token: ${{ secrets.JARVIS_WORKSPACE_READ_TOKEN || github.token }}
          path: JARVIS.FRONTEND
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ vars.JARVIS_MOBILE_REPOSITORY }}
          token: ${{ secrets.JARVIS_WORKSPACE_READ_TOKEN || github.token }}
          path: JARVIS.MOBILE
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: '8.11.1'
      - name: Android JVM tests and lint
        run: gradle -p JARVIS.MOBILE :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Frontend and generated contract parity
        shell: pwsh
        run: |
          ./JARVIS.CORE/scripts/sync-frontend.ps1 -Check
          ./JARVIS.CORE/scripts/check-mobile-contracts.ps1
      - name: Browser regression
        working-directory: JARVIS.CORE
        run: |
          dotnet build Jarvis.sln
          npm ci --no-fund
          npx playwright install --with-deps chromium
          npm run test:browser
