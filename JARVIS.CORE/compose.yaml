name: jarvis
services:
  postgres:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JARVIS_DATABASE:?Run scripts/start-server.ps1}
      POSTGRES_USER: ${JARVIS_DATABASE_USER:?Run scripts/start-server.ps1}
      POSTGRES_PASSWORD: ${JARVIS_POSTGRES_PASSWORD:?Run scripts/start-server.ps1}
    ports:
      - "127.0.0.1:${JARVIS_POSTGRES_PORT:?Run scripts/start-server.ps1}:${JARVIS_DATABASE_PORT:?Run scripts/start-server.ps1}"
    command: ["postgres", "-p", "${JARVIS_DATABASE_PORT:?Run scripts/start-server.ps1}"]
    volumes:
      - jarvis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -p ${JARVIS_DATABASE_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  jarvis-postgres:
