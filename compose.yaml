name: jarvis
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${JARVIS_POSTGRES_PASSWORD:?Set JARVIS_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${JARVIS_POSTGRES_PORT:-15432}:5432"
    volumes:
      - jarvis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  jarvis-postgres:
